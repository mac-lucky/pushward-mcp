name: CI/CD

on:
  push:
    branches: [main]
    # v*-b* excluded: those are iOS app-build marker tags, not releases
    tags: ['v*', '!v*-b*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-cd:
    # Rides @master like the rest of the fleet: a shared-workflow change lands
    # everywhere at once, and the tag-gated model means main pushes only build
    # and test while v* tags publish and cut the GitHub Release.
    uses: mac-lucky/actions-shared-workflows/.github/workflows/go-cicd-reusable.yml@master
    permissions:
      contents: write
      packages: write
      security-events: write
      actions: read
    with:
      app_name: "pushward-mcp"
      ghcr_image: "ghcr.io/mac-lucky/pushward-mcp"
      dockerhub_image: "maclucky/pushward-mcp"
      push_to_dockerhub: false
      main_branch: "main"
      runner_default: "ubuntu-latest"
      runner_amd64: "ubuntu-latest"
      runner_arm64: "ubuntu-24.04-arm"
      skip_qemu_setup: true

      # Go tests cover the transport refactor, the OAuth 2.1 flow (end-to-end
      # against an httptest upstream + in-memory store), and the security units.
      enable_go_tests: true
      go_test_args: "-race"

      # No container/k8s smoke test: http mode exits non-zero without a signing
      # key + hlk encryption key, which would require secrets in CI.
      enable_container_tests: false
      enable_kubernetes_tests: false
    secrets: inherit

  # The MCP server mirrors the app's activity contract, so the release notes
  # open with the app release they target. The version comes from the newest
  # row of the App Store release feed instead of being typed by hand. Tag runs
  # only; on PRs and main pushes the job skips.
  release-app-version-note:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: ci-cd
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: State the required app version in the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(curl -sSf --retry 3 'https://api.pushward.app/app/releases?channel=appstore' | jq -r '.items[0].version')
          test -n "$version" && test "$version" != "null"
          body=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          printf 'Requires the PushWard iOS app %s or later.\n\n%s\n' "$version" "$body" | \
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file -
