    ContentCountdown:
      additionalProperties: true
      description: "Timer: counts down to end_date (direction down, the default; start_date/end_date or duration), or up from start_date (direction up), e.g. how long someone has been asleep. Send \"template\": \"timer\" or its original name \"countdown\"; responses always report countdown. Counting down, the server sends a warning push at warning_threshold and an end push when end_date passes. Counting up there is no end of its own: an optional goal fills a ruler toward a target, after which the card turns orange and keeps counting as overtime; nothing needs to be pushed while it runs, the server keeps it alive past the iOS 8-hour limit (up to about 3 days, or the stale_ttl you set), and ending it freezes the card at the final duration. Both directions pause with paused: true / false. Counting up and pausing need the iOS app 1.19.0 or later; older builds do not show either, so always set state."
      properties:
        accent_color:
          description: "Accent color: named color or hex (#RRGGBB / #RRGGBBAA)."
          type: string
        alarm:
          description: "Opt-in: schedule an iOS AlarmKit alarm at end_date. Requires end_date. Once set, persists across partial updates until cleared with alarm:null or a transition to ENDED. iOS 26+ only. Not used when direction is up."
          type: boolean
        background_color:
          description: "Background color: named color or hex."
          type: string
        compact_label:
          description: Up to 4 characters shown in the Dynamic Island compact leading ear in place of that template's default (the icon, the steps ring, or the timeline high/low stack). Applies to every template. Leading and trailing whitespace is removed server-side and the 4-character limit applies to the trimmed value, so send it trimmed. The minimal presentation ignores it.
          maxLength: 4
          type: string
        compact_trailing_icon:
          description: "Icon shown in the Dynamic Island compact trailing ear in place of that template's default (for example the steps count, a live ETA or the countdown clock). SF Symbol (e.g. airplane.departure) or Material Design Icon with mdi: prefix (e.g. mdi:airplane-takeoff), written with letters, digits, '.', '-', '_' and ':' only. Applies to every template. In the Dynamic Island compact_trailing_label wins when both are set; the Mac notch, which fits one glyph, draws the icon either way. Leading and trailing whitespace is removed server-side, and the 128-character limit and the character rule apply to the trimmed value, so send it trimmed. The minimal presentation ignores it."
          maxLength: 128
          pattern: ^[A-Za-z0-9._:-]*$
          type: string
        compact_trailing_label:
          description: Up to 4 characters shown in the Dynamic Island compact trailing ear in place of that template's default (for example the steps count, a live ETA or the countdown clock). Applies to every template. Takes precedence over compact_trailing_icon when both are set. Leading and trailing whitespace is removed server-side and the 4-character limit applies to the trimmed value, so send it trimmed. The minimal presentation ignores it.
          maxLength: 4
          type: string
        completion_message:
          description: Text shown when the countdown expires (default Completed). Not used when direction is up.
          maxLength: 512
          type: string
        direction:
          description: "down (the default when omitted) counts down to end_date; up counts up from start_date and takes no end_date, duration, warning_threshold, alarm, snooze_seconds or completion_message (a 422 when sent). Switching to up, or from another template, starts a new run: an unsent start_date is replaced by now and the down-only fields are dropped. Switching back to down drops goal and the pause state and needs end_date or duration again."
          enum:
            - down
            - up
          type: string
        duration:
          description: Integer seconds (60) or a duration string ("60s", "5m", "1h30m"). Sets start_date = now and end_date = now + duration. For mid-flight updates that should preserve the original timer, send end_date directly. If both duration and end_date are provided, end_date wins. Not used when direction is up.
          oneOf:
            - maximum: 157788000
              minimum: 1
              type: integer
            - pattern: ^(\d+|(\d+[hms])+)$
              type: string
        end_date:
          description: "Unix timestamp for countdown end. Required when direction is down and duration is not set. Wins over duration when both are set: duration is ignored. Not used when direction is up."
          type: integer
        goal:
          description: "Direction up only: an optional target, integer seconds (7200) or a duration string (\"2h\", \"90m\"); stored and returned as integer seconds. The card fills a ruler toward it, then turns orange and keeps counting as overtime. Cleared with null."
          oneOf:
            - maximum: 157788000
              minimum: 1
              type: integer
            - pattern: ^(\d+|(\d+[hms])+)$
              type: string
        icon:
          description: "Icon name. SF Symbol (e.g. washer, flame) or Material Design Icon with mdi: prefix (e.g. mdi:thermometer)."
          maxLength: 128
          type: string
        paused:
          description: "true pauses a running clock, false resumes a paused one, in either direction. Re-sending the current state changes nothing, unless end_date or duration comes with it: counting down, those set a new window, which drops the earlier pause. Sent to an ended timer it changes nothing, and neither does a re-sent end_date there, so the final reading stays. Counting up, the time spent paused is left out of the clock; counting down, a resume moves end_date (and start_date) on by the paused time, so the time left is where it was. A countdown that ran out but has not ended yet cannot be paused (422). Never stored: read paused_at and paused_seconds instead."
          type: boolean
          writeOnly: true
        paused_at:
          description: "Server-set unix timestamp the clock was paused at; absent while it runs. Set by paused: true. Counting up, an ended clock stops here if it was paused when it ended, else at the activity's ended_at."
          readOnly: true
          type: integer
        paused_seconds:
          description: "Direction up only: server-kept total seconds spent paused so far, updated by paused: false. The clock shows (paused_at, else ended_at once ended, else now) minus start_date minus paused_seconds."
          minimum: 0
          readOnly: true
          type: integer
        progress:
          description: Progress value [0.0 - 1.0]
          maximum: 1
          minimum: 0
          type: number
        remaining_time:
          description: Remaining time in seconds.
          minimum: 0
          type: integer
