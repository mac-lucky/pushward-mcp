          examples:
            - 42
          format: int64
          readOnly: true
          type: integer
        level:
          enum:
            - passive
            - active
            - time-sensitive
            - critical
          examples:
            - active
          type: string
        media_type:
          enum:
            - image
            - video
            - audio
          type: string
        media_url:
          type: string
        metadata:
          additionalProperties:
            type: string
          type: object
        pushed:
          description: Whether the notification was pushed to at least one device.
          readOnly: true
          type: boolean
        reason:
          description: Failure mode when delivery is not 'all'. Set on POST /notifications only.
          enum:
            - no_apns_token
            - apns_rejected
            - push_disabled
          readOnly: true
          type: string
        receipt:
          $ref: "#/components/schemas/NotificationReceipt"
