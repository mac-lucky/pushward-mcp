  /notifications/retract:
    post:
      description: |-
        Takes back the notifications sent with `collapse_id`: every device a `POST /notifications` from the same caller reaches (an organization key: the members' devices its groups and tags reach) gets a silent push, then removes the account's or the organization's notifications it shows under that collapse_id, whichever key sent them, and marks them read in its history. An organization's retract matches only the organization's notifications, a person's only their own. Nothing is deleted on the server, and a device that never got such a notification ignores it. From a person, the app or an organization key without groups or tags, every acknowledged notification of the account or organization sent with that collapse_id stops repeating, whichever key sent it. From an organization key scoped to groups or tags, only the acknowledged notifications that key sent with that collapse_id stop repeating. Their receipts end canceled with cancel_reason retracted. Answers 202 with the number of devices the retraction was sent to; the pushes go out right after.

        Best effort: iOS does not deliver background pushes to an app the user force-quit, and Low Power Mode delays them, so a notification can stay on screen until the app runs again. On Apple devices only PushWard 1.20 or later on iPhone, iPad and Mac retracts; older app versions and Apple Watch are neither sent to nor counted. Every Android device is sent to and counted, including app versions that predate retract, which only sync their inbox. Rate limited to 10 a minute with a burst of 5, per account or organization, across all its keys.
      operationId: retractNotifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetractNotificationsInputBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetractNotificationsOutputBody"
          description: Accepted
        "401":
          content:
            application/problem+json:
              examples:
