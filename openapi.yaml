        slug:
          examples:
            - cpu-load
          maxLength: 128
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]{0,127}$
          type: string
        stale_after:
          description: Seconds after updated_at before clients render the widget as stale. Absent means never demoted.
          format: int64
          maximum: 604800
          minimum: 60
          type: integer
        updated_at:
          format: date-time
          readOnly: true
          type: string
      required:
        - slug
        - name
        - content
        - created_at
        - updated_at
      type: object
    WidgetContent:
      additionalProperties: false
      properties:
        accent_color:
          type: string
        background_color:
          type: string
        device_sort:
          description: Reorders devices on write for the battery template, so the prefix each widget family renders (2 on small, 4 on medium, 8 on large) holds the devices that matter. Keys apply in order; the first that separates two devices wins, so a second key is a tie-break. The stored order changes, so this response and later GETs return the sorted array; devices no key separates keep the order you sent. Omit to keep the order as sent. Ignored for other templates.
          items:
            $ref: "#/components/schemas/DeviceSortKey"
          maxItems: 2
          type:
            - array
            - "null"
        devices:
          items:
            $ref: "#/components/schemas/BatteryDevice"
          maxItems: 8
          type:
            - array
            - "null"
        end_date:
          format: date-time
          type: string
        expired_text:
          examples:
            - Out now
          maxLength: 64
          type: string
        flow:
          $ref: "#/components/schemas/WidgetFlow"
        icon:
          maxLength: 128
          type: string
        label:
          maxLength: 256
          type: string
        max_value:
          format: double
          type: number
        min_value:
          format: double
          type: number
        periods:
          items:
            $ref: "#/components/schemas/SchedulePeriod"
          maxItems: 48
          type:
            - array
            - "null"
        points:
          items:
            format: double
            type: number
          maxItems: 48
          minItems: 2
          type:
            - array
            - "null"
        secondary_url_action:
          $ref: "#/components/schemas/TapAction"
        severity:
          type: string
        start_date:
          format: date-time
          type: string
        stat_rows:
          items:
            $ref: "#/components/schemas/StatRow"
          maxItems: 6
          type:
            - array
            - "null"
        subtitle:
          maxLength: 256
          type: string
        subtitle_timer:
          $ref: "#/components/schemas/TimerValue"
        tap_action:
          $ref: "#/components/schemas/TapAction"
        template:
          description: Visual style of the widget.
          enum:
            - value
            - progress
            - status
            - gauge
            - stat_list
            - trend
            - countdown
            - battery
            - schedule
            - flow
          examples:
            - progress
          type: string
        text_color:
          type: string
        trend:
          enum:
            - up
            - down
            - flat
          examples:
            - up
          type: string
        unit:
          maxLength: 32
          type: string
        url_action:
          $ref: "#/components/schemas/TapAction"
        value:
          format: double
          type: number
      required:
        - template
      type: object
    WidgetFlow:
      additionalProperties: false
      properties:
        exchange:
          $ref: "#/components/schemas/FlowNode"
          description: Two-way link with the outside (grid, mains, upstream).
        inputs:
          description: Production sources (solar, wind, well, ...).
          items:
            $ref: "#/components/schemas/FlowNode"
          maxItems: 3
          type:
            - array
            - "null"
        output:
          $ref: "#/components/schemas/FlowNode"
          description: Consumption endpoint (the house, the cluster, ...).
        storage:
          $ref: "#/components/schemas/FlowNode"
          description: Buffer; carries the 0-100 fill level.
      type: object
  securitySchemes:
    bearer:
      bearerFormat: token
      description: Integration key (hlk_ prefix) or org admin key (hlo_ prefix)
      scheme: bearer
      type: http
info:
  description: |
    PushWard is an APNs gateway for iOS Live Activities.
    Start, update, and end Live Activities on any subscribed device with plain HTTP requests.

    ## Authentication

    All endpoints (except `/health`) require an integration key in the `Authorization` header (the Organizations endpoints an org admin key, below):

    ```
    Authorization: Bearer hlk_aBcDeFgHiJkLmNoPqRsTuVwXyZ012345
    ```

    Integration keys are created in the PushWard iOS app. Each key has a `permissions` object with one level per resource; a higher level includes the lower ones:

    | Resource | Levels | Endpoints |
    |---|---|---|
    | `activities` | `none`, `read`, `update`, `manage` | read: `GET /activities`, `GET /activities/{slug}`; update: also `PATCH /activities/{slug}`; manage: also `POST /activities`, `DELETE /activities/{slug}` and `PATCH ?upsert=true` |
    | `notifications` | `none`, `send`, `schedule` | send: `POST /notifications`, `POST /notifications/retract`, `GET /notifications/answers` and `GET /notifications/answers/{id}`, the `/notifications/receipts` endpoints; schedule: also the `/notifications/scheduled` endpoints |
    | `widgets` | `none`, `read`, `write` | read: `GET /widgets`, `GET /widgets/{slug}`; write: also `POST /widgets`, `PATCH /widgets/{slug}`, `DELETE /widgets/{slug}` |
    | `emails` | `none`, `send` | send: `POST /emails` (verified, opted-in recipients only) |
    | `devices` | `none`, `read`, `manage` | read: `GET /devices`, `GET /devices/{device_id}`, `GET /devices/{device_id}/subscriptions` and `GET /devices/{device_id}/subscriptions/{slug}`; manage: also `PATCH /devices/{device_id}` (rename), `DELETE /devices/{device_id}`, and following and unfollowing activities (`POST` and `DELETE /devices/{device_id}/subscriptions/{slug}`) |
    | `sharing` | `none`, `read`, `manage` | read: `GET /permissions`, `GET /activities/{slug}/permissions`; manage: also `POST /activities/{slug}/permissions`, `POST /permissions/patterns`, `PATCH /permissions/{id}` (these three need a subscription) and `DELETE /permissions/{id}` |
    | `account` | `none`, `read`, `manage` | read: `GET /app/onboarding`, `GET /emails/recipients`; manage: also `PATCH /auth/me` (nickname), `PATCH /app/onboarding` and the other `/emails/recipients` endpoints |

    `devices`, `sharing` and `account` are opt-in: every key starts at `none` on them, the default key included, and they are granted from the app. The default key can give another key no more of them than it was granted.

    A key has no device of its own: `is_current` is false on every device it lists, and it may remove any of them. Signing in and out, deleting the account, registering devices, purchases, redeeming share codes, the notification inbox and organization membership stay with the app.

    `GET /auth/me` works with every key and reports the calling key's permissions under `integration_key`. A key can also be restricted to activity slugs (`activity_slugs`) and widget slugs (`widget_slugs`), exact or with a trailing `*`, and can have an `expires_at`, after which it answers `401 integration_key.expired`. Requests outside the key's permissions receive `403 integration_key.permission_denied`, with a `detail` naming the level they need.

    Older fields stay on every key for existing clients: `scope` is `activity:<level>`, and the booleans `notifications` (send or schedule), `widgets` (write) and `emails` (send) summarize the levels. Create and update accept either `permissions` or those older fields (where `true` means the resource's highest level), not both.

    **The account's default key** (`is_default: true`, created by the app) can also use the `/integrations/keys` endpoints to create, list, update, roll and revoke the account's other keys. It cannot give a key a permission above its own, and cannot change a default key. Keys it creates keep working when the default key is revoked or rolled.

    ## Organization administration

    The Organizations endpoints take an org admin key (`hlo_`), which an owner or admin of the organization creates in the PushWard console. An org admin key administers one organization and sends nothing; an integration key sends and administers no organization, so a leaked integration key cannot change the organization.

    | Level | Acts as | Can |
    |---|---|---|
    | `read` | a viewer | read the organization, its members, audit log, device fleet, groups, tags and routes |
    | `manage` | an admin | also rename it, invite, change and remove members and viewers, manage its integration keys, groups, tags and routes |

    Both levels read the plan, seats and invoices and neither can change them. Neither can touch owners, admins or billing members, grant those roles, or delete the organization. Each endpoint says which level it needs; below it the answer is `403 org.permission_denied`. A key gets `404 org.not_found` for any organization but its own and `403 org_admin_key.not_allowed` on every endpoint outside this group (`403 billing.console_only` on the billing ones). An expired key gets `401 org_admin_key.expired`. A key is revoked when the person who created it leaves or is removed from the organization, moves to the billing, member or viewer role, or deletes their account. An organization that is not active still answers reads; most writes get `403 org.billing_inactive`.

    ## Errors

    Errors are RFC 9457 problem details (`application/problem+json`). The `code` member is a stable programmatic identifier -- match on it instead of `detail`. Rate-limit and quota responses (`429`) also set a `Retry-After` header and `retry_after_ms`, as does `503 service.unavailable` -- a `503` means the request itself was fine and the server could not reach a dependency, so retry it rather than treating it as a failed delivery.

    ## Activity State Machine

    Activities follow a state machine with two client-visible states:

    | State | Description |
    |---|---|
    | `ENDED` | Inactive (default on creation) |
    | `ONGOING` | Active Live Activity running on device |

    **Transitions via `PATCH /activities/{slug}`:**

    | From -> To | Push Action |
    |---|---|
    | ENDED -> ONGOING | Push-to-start (starts Live Activity) |
    | ONGOING -> ONGOING | Push update (updates content) |
    | ONGOING -> ENDED | Push end (dismisses after 4 hours) |

    ## Countdown Lifecycle

    Activities on the `timer` template (also accepted as `countdown`, the name responses report) count down to `end_date`, or with `direction: up` count up from `start_date` (default: the first write). The server manages both:

    - **Warning push:** When `warning_threshold` seconds remain, the server sends an update with `accent_color: orange`
    - **Completion push:** When `end_date` is reached, the server ends the activity with `completion_message` (or "Completed") and `progress: 1.0`
    - **Counting up:** an up clock has no end of its own; with `goal` set, the server re-sends the card when the goal passes so it switches to its overtime look
    - **Pause / resume:** `paused: true` stops the clock in either direction, `paused: false` restarts it; the server keeps `paused_at` (and, counting up, `paused_seconds`), and a resumed countdown's `end_date` moves on by the paused time
    - **Long runs:** an up clock or a paused countdown is kept alive past the iOS 8-hour limit (up to about 3 days), unless its `stale_ttl` passes first
    - **End:** ending the activity freezes the card at its final value

    No client action is needed after the initial start -- the server handles the full lifecycle.

    ## Colors

    Templates support optional color fields (`accent_color`, `background_color`, `text_color`):

    - **Named colors:** `red`, `orange`, `yellow`, `green`, `blue`, `purple`, `pink`, `indigo`, `teal`, `cyan`, `mint`, `brown`
    - **Hex RGB:** `#FF5733` or `FF5733`
    - **Hex RGBA:** `#FF573380` or `FF573380`
