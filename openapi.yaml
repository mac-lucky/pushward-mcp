          examples:
            - deploy-prod
          type: string
        answer_cursor:
          description: "The answer stream's cursor (GET /notifications/answers) as of this send, when answerable: every answer to this notification comes after it. A reader that already holds a cursor keeps reading from it. A reader with no cursor yet takes the answer_cursor of its first answerable send as its cursor and keeps it; the answer_cursor of later sends adds nothing. Cursors are opaque and never compared; store it as it is. Set on POST /notifications only, not on scheduled sends."
          examples:
            - "57"
          readOnly: true
          type: string
        answerable:
          description: "The server records the answer to this notification: at least one action was sent without a url. Read it with GET /notifications/answers/{id}. Set on POST /notifications only."
          readOnly: true
          type: boolean
        body:
          examples:
            - Successfully deployed to production
          type: string
