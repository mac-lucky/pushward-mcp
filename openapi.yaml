          additionalProperties:
            type: string
          description: HTTP headers for http(s) action URLs. Total <=1KB. Ignored for custom-scheme URLs.
          type: object
        icon:
          description: SF Symbol name (iOS 15+)
          examples:
            - checkmark.circle
          maxLength: 64
          type: string
        id:
          description: Stable identifier returned when the user taps this action
          examples:
            - approve
          maxLength: 64
          minLength: 1
          type: string
        method:
          description: HTTP method for http(s) action URLs (case-insensitive; default GET when omitted). One of GET, POST, PUT, PATCH, DELETE, HEAD. Ignored for custom-scheme URLs.
          examples:
            - POST
          type: string
        text_input:
          description: "Show an inline text field when the action is tapped (reply-with-text). Requires a silent (non-foreground) action with an http(s) url or no url. With a url, the typed text replaces {{input}} in body; without the placeholder it is sent as {\"text\": ...} (merged into a JSON-object body, replacing other body shapes). Without a url, the server records the reply (GET /notifications/answers/{id})."
          type: boolean
        text_input_button_title:
          description: Label of the send button next to the reply field (defaults to the action title on-device). Requires text_input.
          maxLength: 64
          type: string
        text_input_placeholder:
          description: Placeholder shown in the reply text field. Requires text_input.
          maxLength: 64
          type: string
        title:
          description: Button label shown to the user
          examples:
            - Approve
          maxLength: 64
          minLength: 1
          type: string
        url:
          description: "URL opened/dispatched when the action is tapped. Any URL scheme is accepted except javascript:, data:, and file:. http(s) URLs require a host. Omit it on a silent (non-foreground) action to have the server record the tap, and any typed reply, instead: read it with GET /notifications/answers/{id}."
          examples:
            - https://example.com/approve/123
          maxLength: 2048
          type: string
      required:
        - id
        - title
      type: object
    NotificationAnswer:
      additionalProperties: false
      properties:
        action_id:
          description: ID of the action the user tapped.
          type: string
        answered_at:
          description: When the answer was recorded.
          format: date-time
          type: string
        collapse_id:
          description: The collapse_id the notification was sent with, if any.
          type: string
        notification_id:
          description: The notification this answer belongs to.
          format: int64
          type: integer
        status:
          description: "pending: not answered yet. answered: action_id (and text for a reply) are set."
          enum:
            - pending
            - answered
          type: string
        text:
          description: Text the user typed, for a text_input action.
          type: string
        thread_id:
          description: The thread_id the notification was sent with, if any.
          type: string
      required:
        - notification_id
        - status
      type: object
    NotificationAnswerFeed:
      additionalProperties: false
      properties:
        cursor:
          description: Opaque. Pass it as after on the next call; it is unchanged when items is empty.
          type: string
        items:
          description: Answers recorded after the cursor, oldest first. Each has status answered.
          items:
            $ref: "#/components/schemas/NotificationAnswer"
          type:
            - array
            - "null"
      required:
        - items
        - cursor
      type: object
    NotificationReceipt:
      additionalProperties: false
      properties:
        acknowledged_at:
          description: When it was acknowledged.
          format: date-time
          type: string
        acknowledged_by:
          description: "User id of who acknowledged it: the account, or for an organization the member (when the app reported it)."
          type: string
        acknowledged_by_device:
          description: Name (else model) of the device it was acknowledged on, when the app reported it. Personal sends only.
          type: string
        action_id:
          description: ID of the action that acknowledged it (pw_ack for the button the server adds).
          type: string
        callback:
          $ref: "#/components/schemas/NotificationReceiptCallback"
          description: Delivery of the callback_url event, when the send had one.
        cancel_reason:
          description: "api: canceled by id. tag: canceled by tag. superseded: a newer acknowledged send from the same key with the same collapse_id replaced it. key_revoked: the sending key was revoked, expired or lost notifications access. org_disabled: organizations were switched off. retracted: POST /notifications/retract took back its collapse_id. A retract from a person, the app or an organization key without groups or tags cancels it whichever key sent it. A retract from an organization key scoped to groups or tags cancels it only when that key sent it."
          enum:
            - api
            - tag
            - superseded
            - key_revoked
            - org_disabled
            - retracted
          type: string
        canceled_at:
          description: When it was canceled.
          format: date-time
          type: string
        created_at:
          description: When it was created (the send).
          format: date-time
          type: string
        expires_at:
          description: When the receipt expires if nobody acknowledges it.
          format: date-time
          type: string
        last_delivered_at:
          description: When a push (the first send or a repeat) last reached at least one device.
          format: date-time
          type: string
        notification_id:
          description: The notification this receipt belongs to (the id POST /notifications returned).
          format: int64
          type: integer
        repeat_seconds:
          description: Seconds between repeats.
          format: int64
          type: integer
        repeats_sent:
          description: Repeats sent so far (the first send not counted). At most 50.
          format: int64
          type: integer
        status:
          description: "active: repeating until acknowledged. acknowledged: an action was tapped (see action_id). expired: expire_seconds passed first. canceled: stopped before either, see cancel_reason."
          enum:
            - active
            - acknowledged
            - expired
            - canceled
          type: string
        tags:
          description: The tags it was sent with.
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - notification_id
        - status
        - repeat_seconds
        - expires_at
        - repeats_sent
        - created_at
      type: object
    NotificationReceiptCallback:
      additionalProperties: false
      properties:
        attempts:
          description: Delivery attempts so far.
          format: int64
          type: integer
        delivered_at:
          description: When the endpoint accepted it.
          format: date-time
          type: string
        last_status_code:
          description: HTTP status of the latest attempt that got a response.
          format: int64
          type: integer
        status:
          description: "pending: the event is not delivered yet (or not due yet, while the receipt is active). delivered: the endpoint answered 2xx. failed: retries ran out, the endpoint answered 410, or the key was revoked."
          enum:
            - pending
            - delivered
            - failed
          type: string
      required:
        - status
        - attempts
      type: object
