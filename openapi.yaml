  - description: Authentication and account management
    name: Auth
  - description: Create, list, and manage trackable activities
    name: Activities
  - description: Register iOS devices for push notifications
    name: Devices
  - description: Scoped keys for external services (Home Assistant, IoT, CI/CD)
    name: Integration Keys
  - description: Share activities with other users via invite codes, direct grants, or slug patterns
    name: Permissions
  - description: In-app notification inbox with optional APNs push delivery
    name: Notifications
  - description: Transactional email channel (verified-recipient relay via AWS SES)
    name: Email
  - description: Server-driven iOS WidgetKit widgets (iOS 26+)
    name: Widgets
  - description: "Administer an organization with an org admin key (hlo_): its members, invites, audit log, device fleet, sending keys and routing, and read its plan and invoices"
    name: Organizations
