          examples:
            - garage-door
          type: string
        created_at:
          description: Timestamp when the notification was created.
          format: date-time
          readOnly: true
          type: string
        delivery:
          description: APNs fan-out outcome across the user's devices. Set on POST /notifications only.
          enum:
            - none
            - partial
            - all
          readOnly: true
          type: string
        encrypted:
          description: End-to-end encrypted title, subtitle, body and url (a pw1 envelope). When set, title and body are placeholders that devices holding the key replace with the decrypted text.
          type: string
        icon_url:
          type: string
