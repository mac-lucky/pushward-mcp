    CreateActivityRequest:
      additionalProperties: false
      properties:
        dismissal_ttl:
          description: "Seconds after ENDED before the Live Activity leaves the iOS Lock Screen (0 = immediately, max 14400 = 4h). Unset: removal follows ended_ttl capped at 4h. Ignored for evicted (preempted) activities."
          format: int64
          maximum: 14400
          minimum: 0
          type: integer
        ended_ttl:
          description: Seconds after ENDED before auto-delete (1s to 30 days)
          format: int64
          maximum: 2592000
          minimum: 1
          type: integer
        name:
          description: Human-readable activity name
          maxLength: 256
          minLength: 1
          type: string
        priority:
          description: Eviction priority (0=lowest, 10=highest, default 0)
          format: int64
          maximum: 10
          minimum: 0
          type: integer
        slug:
          description: Unique activity identifier (alphanumeric, hyphens, underscores)
          maxLength: 128
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]{0,127}$
          type: string
        stale_ttl:
          description: Seconds of inactivity before auto-ending (1s to 30 days)
          format: int64
          maximum: 2592000
          minimum: 1
          type: integer
        target:
          $ref: "#/components/schemas/OrgTargetRequest"
          description: "Organization keys only: who the Live Activity reaches, narrowing the organization's routing rules. Omit to reach everyone the rules allow (or, for a key limited to some groups and tags, all of those). Re-POSTing an existing slug without it keeps the stored target."
      required:
        - slug
        - name
      type: object
    CreateIntegrationKeyInputBody:
      additionalProperties: false
