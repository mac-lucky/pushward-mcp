          description: Up to 4 characters shown in the Dynamic Island compact leading ear in place of that template's default (the icon, the steps ring, or the timeline high/low stack). Applies to every template. Leading and trailing whitespace is removed server-side and the 4-character limit applies to the trimmed value, so send it trimmed. The minimal presentation ignores it.
          maxLength: 4
          type: string
        compact_trailing_icon:
          description: "Icon shown in the Dynamic Island compact trailing ear in place of that template's default (for example the steps count, a live ETA or the countdown clock). SF Symbol (e.g. airplane.departure) or Material Design Icon with mdi: prefix (e.g. mdi:airplane-takeoff), written with letters, digits, '.', '-', '_' and ':' only. Applies to every template. In the Dynamic Island compact_trailing_label wins when both are set; the Mac notch, which fits one glyph, draws the icon either way. Leading and trailing whitespace is removed server-side, and the 128-character limit and the character rule apply to the trimmed value, so send it trimmed. The minimal presentation ignores it."
          maxLength: 128
          pattern: ^[A-Za-z0-9._:-]*$
          type: string
        compact_trailing_label:
          description: Up to 4 characters shown in the Dynamic Island compact trailing ear in place of that template's default (for example the steps count, a live ETA or the countdown clock). Applies to every template. Takes precedence over compact_trailing_icon when both are set. Leading and trailing whitespace is removed server-side and the 4-character limit applies to the trimmed value, so send it trimmed. The minimal presentation ignores it.
