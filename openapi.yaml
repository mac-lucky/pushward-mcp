paths:
  /activities:
    get:
      operationId: listActivities
      parameters:
        - description: Maximum number of activities to return (1-100, default 50).
          explode: false
          in: query
          name: limit
          schema:
            description: Maximum number of activities to return (1-100, default 50).
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Opaque pagination cursor from a previous response's next_cursor. Omit to start from the beginning.
          explode: false
          in: query
          name: after
          schema:
            description: Opaque pagination cursor from a previous response's next_cursor. Omit to start from the beginning.
            type: string
        - description: Optional filter on activity state. Accepts ongoing, ended, or preempted (case-insensitive). Omit to return all states.
          explode: false
          in: query
          name: state
          schema:
            description: Optional filter on activity state. Accepts ongoing, ended, or preempted (case-insensitive). Omit to return all states.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListActivitiesPage"
          description: OK
        "400":
          content:
            application/problem+json:
              examples:
                invalid_cursor:
                  summary: The after parameter is not a cursor issued by the server
                  value:
                    code: cursor.invalid
                    detail: invalid cursor
                    instance: /requests/9f86d081884c7d65
                    status: 400
                    title: Bad Request
                    type: https://pushward.app/errors/bad-request
                invalid_state:
                  summary: Unrecognized state filter value
                  value:
                    code: activity.state_invalid
                    detail: "invalid activity state: \"paused\", must be one of ongoing, ended, preempted"
                    instance: /requests/9f86d081884c7d65
                    status: 400
                    title: Bad Request
                    type: https://pushward.app/errors/bad-request
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              examples:
                key_expired:
                  summary: Integration key past its expires_at
                  value:
                    code: integration_key.expired
                    detail: integration key expired
                    instance: /requests/9f86d081884c7d65
                    status: 401
                    title: Unauthorized
                    type: https://pushward.app/errors/unauthorized
                token_invalid:
                  summary: Missing, unknown or revoked token
                  value:
                    code: token.invalid
                    detail: invalid token
                    instance: /requests/9f86d081884c7d65
                    status: 401
                    title: Unauthorized
                    type: https://pushward.app/errors/unauthorized
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              examples:
                insufficient_scope:
                  summary: Integration key has no activity access
                  value:
                    code: integration_key.permission_denied
                    detail: "insufficient permissions: requires activities:read"
                    instance: /requests/9f86d081884c7d65
                    status: 403
                    title: Forbidden
                    type: https://pushward.app/errors/forbidden
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              examples:
                unprocessable_entity:
                  value:
                    detail: validation failed
                    errors:
                      - location: query.limit
                        message: expected number <= 100
                    instance: /requests/9f86d081884c7d65
                    status: 422
                    title: Unprocessable Entity
                    type: https://pushward.app/errors/unprocessable-entity
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              examples:
                rate_limit.exceeded:
                  value:
                    code: rate_limit.exceeded
                    detail: rate limit exceeded
                    instance: /requests/9f86d081884c7d65
                    retry_after_ms: 60000
                    status: 429
                    title: Too Many Requests
                    type: https://pushward.app/errors/too-many-requests
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              examples:
                internal_server_error:
                  value:
                    detail: failed to list activities
                    instance: /requests/9f86d081884c7d65
                    status: 500
                    title: Internal Server Error
                    type: https://pushward.app/errors/internal-server-error
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              examples:
                service.unavailable:
                  value:
                    code: service.unavailable
                    detail: service temporarily unavailable
                    instance: /requests/9f86d081884c7d65
                    status: 503
                    title: Service Unavailable
                    type: https://pushward.app/errors/service-unavailable
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      security:
        - bearer: []
      summary: List activities
      tags:
        - Activities
    post:
      operationId: createActivity
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateActivityRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
          description: Created
          headers:
            X-Resource-Action:
              schema:
                description: "'created' when a new activity was inserted; 'updated' when an existing slug was refreshed (name/priority/TTLs)."
                type: string
        "400":
          content:
            application/problem+json:
              examples:
                bad_request:
                  value:
                    detail: validation failed
                    errors:
                      - location: body
                        message: invalid character '}' looking for beginning of value
                    instance: /requests/9f86d081884c7d65
                    status: 400
                    title: Bad Request
                    type: https://pushward.app/errors/bad-request
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              examples:
                key_expired:
                  summary: Integration key past its expires_at
                  value:
                    code: integration_key.expired
                    detail: integration key expired
                    instance: /requests/9f86d081884c7d65
                    status: 401
                    title: Unauthorized
                    type: https://pushward.app/errors/unauthorized
                token_invalid:
                  summary: Missing, unknown or revoked token
                  value:
                    code: token.invalid
                    detail: invalid token
                    instance: /requests/9f86d081884c7d65
                    status: 401
                    title: Unauthorized
                    type: https://pushward.app/errors/unauthorized
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              examples:
                insufficient_scope:
                  summary: Integration key's activities level is below manage
                  value:
                    code: integration_key.permission_denied
                    detail: "insufficient permissions: requires activities:manage"
                    instance: /requests/9f86d081884c7d65
                    status: 403
                    title: Forbidden
                    type: https://pushward.app/errors/forbidden
                slug_not_allowed:
                  summary: Key is restricted to activity slugs the target does not match
                  value:
                    code: integration_key.slug_invalid
                    detail: key not allowed for this activity
                    instance: /requests/9f86d081884c7d65
                    status: 403
                    title: Forbidden
                    type: https://pushward.app/errors/forbidden
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "409":
          content:
            application/problem+json:
              examples:
                activity.limit_exceeded:
                  value:
                    code: activity.limit_exceeded
                    detail: activity limit reached (max 50)
                    instance: /requests/9f86d081884c7d65
                    status: 409
                    title: Conflict
                    type: https://pushward.app/errors/conflict
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              examples:
                unprocessable_entity:
                  value:
                    detail: validation failed
                    errors:
                      - location: body.slug
                        message: expected string to match pattern ^[a-zA-Z0-9][a-zA-Z0-9_-]{0,127}$
                    instance: /requests/9f86d081884c7d65
                    status: 422
                    title: Unprocessable Entity
                    type: https://pushward.app/errors/unprocessable-entity
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              examples:
                quota_exceeded:
                  summary: Free-tier monthly quota exhausted
                  value:
                    code: quota.exceeded
                    detail: quota exceeded for live_activity_updates
                    instance: /requests/9f86d081884c7d65
                    kind: live_activity_updates
                    limit: 250
                    reset_at: "2026-08-01T00:00:00Z"
                    status: 429
                    title: Too Many Requests
                    type: https://pushward.app/errors/too-many-requests
                    used: 250
                rate_limit:
                  summary: Per-client rate limit exceeded
                  value:
                    code: rate_limit.exceeded
                    detail: rate limit exceeded
                    instance: /requests/9f86d081884c7d65
                    retry_after_ms: 60000
                    status: 429
                    title: Too Many Requests
                    type: https://pushward.app/errors/too-many-requests
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              examples:
                internal_server_error:
                  value:
                    detail: failed to create activity
                    instance: /requests/9f86d081884c7d65
                    status: 500
                    title: Internal Server Error
                    type: https://pushward.app/errors/internal-server-error
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              examples:
                service.unavailable:
                  value:
                    code: service.unavailable
                    detail: service temporarily unavailable
                    instance: /requests/9f86d081884c7d65
                    status: 503
                    title: Service Unavailable
                    type: https://pushward.app/errors/service-unavailable
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      security:
        - bearer: []
      summary: Create activity
      tags:
        - Activities
