    post:
      description: Queues a notification to be sent at `send_at` (at most 365 days ahead). The body is a `POST /notifications` body plus `send_at`, validated the same way. Add `recurrence` (a cron expression and a time zone) to repeat it; `send_at` is then optional and marks where the schedule starts. A repeating schedule keeps one id and one pending slot for the whole series, and canceling it stops the series. Each send counts against the notification quota when it happens, not when it is scheduled; an account already out of quota gets the same `429 quota.exceeded` as `POST /notifications`. Up to 25 scheduled notifications can be pending per account. Revoking the integration key that scheduled one cancels it. With `acknowledge`, the receipt is created when it is sent; if acknowledged notifications are switched off at that moment, or 25 acknowledged notifications are already active, it goes out as a plain notification, and `GET /notifications/receipts/{id}` answers 404 for it.
      operationId: createScheduledNotification
      parameters:
        - description: "Identifies this send across retries, so a repeated request does not schedule it twice. Use a new random value for each send: a request repeating a key gets the schedule the first attempt made, whatever its body. A key applies per account and integration key, for as long as the schedule exists. Printable ASCII without spaces."
          in: header
          name: Idempotency-Key
          schema:
            description: "Identifies this send across retries, so a repeated request does not schedule it twice. Use a new random value for each send: a request repeating a key gets the schedule the first attempt made, whatever its body. A key applies per account and integration key, for as long as the schedule exists. Printable ASCII without spaces."
            maxLength: 128
            pattern: ^[!-~]+$
