          format: int64
          type: integer
        status:
          description: HTTP status code for this response.
          examples:
            - 429
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type.
          examples:
            - Too Many Requests
          type: string
        type:
          default: about:blank
          description: A URI reference that identifies the problem type. Resolvable to human-readable documentation when possible.
          examples:
            - https://pushward.app/errors/too-many-requests
          format: uri
          type: string
      type: object
