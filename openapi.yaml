    ScheduledNotification:
      additionalProperties: false
      properties:
        acknowledge:
          $ref: "#/components/schemas/NotificationAcknowledge"
          description: "Repeat the notification until someone acknowledges it: any tap on an action without a url that does not open the app (foreground false) counts, and when there is none the server adds an Acknowledge button (id pw_ack). Track it with GET /notifications/receipts/{id} (the response's receipt). Not with push false or level passive. At most 25 active per account."
        actions:
          description: Server-driven action buttons. Max 10 (Apple cap).
          items:
            $ref: "#/components/schemas/NotificationAction"
          maxItems: 10
          type:
            - array
            - "null"
        activity_slug:
          type: string
        body:
          description: Notification body. Required unless encrypted is set; leave it out then (the server stores a placeholder).
          maxLength: 4096
          type: string
        callback_url:
          description: https URL that receives a signed POST once the notification is acknowledged or expires (Standard Webhooks, signed with a secret derived from the sending integration key). Requires acknowledge and an integration key.
          maxLength: 2048
          type: string
        canceled_at:
          description: When the schedule was canceled. Set when status is canceled.
          format: date-time
          readOnly: true
          type: string
        collapse_id:
          description: "Collapse ID for replacing notifications: a later notification with the same collapse_id replaces this one on the devices. POST /notifications/retract with it removes them from the devices."
          maxLength: 64
          type: string
        created_at:
          description: When the schedule was created.
          format: date-time
          readOnly: true
          type: string
        delivery:
          description: APNs fan-out outcome of the latest send, as on POST /notifications.
          enum:
            - none
            - partial
            - all
          readOnly: true
          type: string
        encrypted:
          description: "End-to-end encrypted title, subtitle, body and url: a pw1 envelope sealed with the user's encryption key (see the encryption docs). Leave title, subtitle, body and url out when it is set; the stored and pushed title and body become placeholders that devices holding the key replace with the decrypted text. Everything else (level, sound, source, media, actions, metadata) stays plaintext. Organization keys can send encrypted notifications too, sealed with the organization's key: every member's devices need that key, which members add in PushWard 1.18 or later. If PushWard switches encryption off for organizations, they get 422 notification.encryption_unavailable."
          maxLength: 3072
          type: string
        failure_reason:
          description: "Why the notification (for a repeating schedule: the latest occurrence) was not sent. receipt_limit: older schedules only; it asked for acknowledge while 25 acknowledged notifications were already active (such a send now goes out as a plain notification instead). key_revoked: the integration key that scheduled it was revoked, expired, or no longer has notifications level schedule. target_deleted: every group, tag and member an organization's target named was deleted or left the organization. Both end a repeating schedule, except that target_deleted only skips the send while the target names a member who could be invited back. org_inactive: the organization was not active when it was due; a repeating schedule carries on with its next send."
          enum:
            - quota_exceeded
            - receipt_limit
            - key_revoked
            - target_deleted
            - org_inactive
            - internal_error
          readOnly: true
          type: string
        icon_url:
          description: http or https URL for per-notification source avatar, shown as the Communication Notification avatar on iOS. Recommended <=256x256 and <=100 KB; responses larger than 512 KB are rejected by the iOS extension to protect the 24 MB memory budget.
          maxLength: 2048
          type: string
        id:
          description: Server-assigned schedule ID (not a notification ID).
          examples:
            - 7
          format: int64
          readOnly: true
          type: integer
        last_sent_at:
          description: When the latest occurrence was sent. Set once one has been.
          format: date-time
          readOnly: true
          type: string
        level:
          description: "Interruption level (default: active)"
          enum:
            - passive
            - active
            - time-sensitive
            - critical
          type: string
        media:
          $ref: "#/components/schemas/MediaAttachment"
          description: Rich media attachment (image, video, or audio). HTTPS only.
        metadata:
          additionalProperties:
            type: string
          type: object
        notification_id:
          description: ID of the notification created by the latest send.
          format: int64
          readOnly: true
          type: integer
        occurrence:
          description: "For a repeating schedule: how many sends have gone out so far (skipped ones not counted)."
          format: int64
          readOnly: true
          type: integer
        push:
          default: true
          description: Send as an APNs push to the user's devices. Defaults to true; set false to store in the inbox only.
          type: boolean
        reason:
          description: Why delivery is not 'all', as on POST /notifications.
          enum:
            - no_apns_token
            - apns_rejected
            - push_disabled
          readOnly: true
          type: string
        recurrence:
          $ref: "#/components/schemas/Recurrence"
          description: The repeat rule, for a repeating schedule.
          readOnly: true
        send_at:
          description: When the notification is (or was) due. For a repeating schedule, the next occurrence.
          format: date-time
          type: string
        sent_at:
          description: When the notification was sent. Set when status is sent.
          format: date-time
          readOnly: true
          type: string
        snooze:
          description: "Offer snooze actions: 1 to 3 different durations in minutes (1-1440 each). The apps show one snooze action per duration; tapping one hides the notification and shows it again on that device after that many minutes. Snoozing happens on the device: the server records nothing, and a snooze tap is not an answer. Not with acknowledge, and actions plus snooze count at most 10. Stays plaintext beside encrypted, like actions. App versions without snooze support show the notification without the snooze actions."
          examples:
            - - 15
              - 60
          items:
            format: int64
            maximum: 1440
            minimum: 1
            type: integer
          maxItems: 3
          minItems: 1
          type:
            - array
            - "null"
          uniqueItems: true
        source:
          description: Source identifier
          maxLength: 128
          type: string
        source_display_name:
          description: Human-readable source name
          maxLength: 256
          type: string
        status:
          description: "scheduled: waiting for send_at. sending: being sent right now. sent: delivered as notification_id. failed: not sent, see failure_reason. canceled: canceled before it was sent (a repeating one: before its next send), see canceled_at; kept 24 hours, then deleted. A repeating schedule goes back to scheduled after each occurrence until its rule runs out."
          enum:
            - scheduled
            - sending
            - sent
            - failed
            - canceled
          readOnly: true
          type: string
        subtitle:
          description: Notification subtitle
          maxLength: 256
          type: string
        tags:
          description: "Labels for canceling acknowledged notifications as a group (POST /notifications/receipts/cancel): up to 10, each 1-64 printable ASCII characters without spaces. Requires acknowledge."
          items:
            type: string
          maxItems: 10
          type:
            - array
            - "null"
        target:
          $ref: "#/components/schemas/OrgTargetRequest"
          description: "Organization keys only: who receives it, narrowing the organization's routing rules. Omit to reach everyone the rules allow (or, for a key limited to some groups and tags, all of those)."
        thread_id:
          description: Thread identifier for grouping
          maxLength: 128
          type: string
        title:
          description: Notification title. Required unless encrypted is set; leave it out then (the server stores a placeholder).
          maxLength: 256
          type: string
        url:
          description: Action URL
          maxLength: 2048
          type: string
        volume:
          description: Volume for critical alerts (0.0-1.0)
          format: double
          maximum: 1
          minimum: 0
          type: number
      required:
        - id
        - status
        - send_at
        - created_at
        - title
        - body
      type: object
