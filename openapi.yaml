          type: boolean
        snooze_seconds:
          description: How many seconds POST /activities/{slug}/snooze extends end_date, and the iOS AlarmKit postAlert (snooze) window. Defaults to 300 (5 min) when omitted. Only meaningful with alarm:true. Not used when direction is up.
