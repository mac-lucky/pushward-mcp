  /notifications/answers:
    get:
      description: "Returns the answers recorded after the cursor `after`, oldest first, with the cursor to pass next. One loop over it reacts to every answer (an automation), instead of one `GET /notifications/answers/{id}` per notification. Each item has the shape of `GET /notifications/answers/{id}`, `collapse_id` and `thread_id` included when the notification was sent with them. Call it first without `after`: the response has no items and the current cursor, so a new reader does not replay the answers kept for 30 days. Take that cursor when the reader is set up, before it sends anything it waits on. An answerable `POST /notifications` response carries `answer_cursor`, the cursor as of that send. A reader that already holds a cursor keeps reading from it. A reader with no cursor yet takes the `answer_cursor` of its first answerable send as its cursor and keeps it; the `answer_cursor` of later sends adds nothing. Cursors are opaque and never compared. A scheduled send's response has no `answer_cursor`; its answers come after it fires, so a cursor taken when it was scheduled covers them. Then call with `after` and `wait` (up to 25 seconds) to hold the request open until the next answer arrives; with nothing new it returns no items and the same cursor. Store the cursor to resume after a restart. An integration key reads only answers to notifications it sent (an organization key's, whichever member answered); the app reads every answer of the account. Waits here have a limit of their own, apart from `GET /notifications/answers/{id}`: two at a time per integration key (or for the app), and a limit per server; past either the call answers 429 with `retry_after_ms`, so retry after it or call without `wait`."
      operationId: listNotificationAnswers
      parameters:
        - description: "The cursor of your previous response. Leave it out on the first call: that response holds no answers, only the current cursor, so a new reader starts from now instead of replaying the answers kept for 30 days."
          explode: false
          in: query
          name: after
          schema:
            description: "The cursor of your previous response. Leave it out on the first call: that response holds no answers, only the current cursor, so a new reader starts from now instead of replaying the answers kept for 30 days."
            maxLength: 64
            type: string
        - description: Seconds to hold the request open while no answer has arrived after the cursor (long-poll). Returns as soon as one lands, or with no items and the same cursor when the time runs out. Ignored on the first call (no after).
          explode: false
          in: query
          name: wait
          schema:
            default: 0
            description: Seconds to hold the request open while no answer has arrived after the cursor (long-poll). Returns as soon as one lands, or with no items and the same cursor when the time runs out. Ignored on the first call (no after).
            format: int64
            maximum: 25
            minimum: 0
            type: integer
        - description: The most answers to return. When a page comes back full, call again at once with its cursor.
          explode: false
          in: query
          name: limit
          schema:
            default: 100
            description: The most answers to return. When a page comes back full, call again at once with its cursor.
            format: int64
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationAnswerFeed"
          description: OK
        "400":
          content:
            application/problem+json:
              examples:
                cursor.invalid:
                  value:
                    code: cursor.invalid
                    detail: malformed cursor
                    instance: /requests/9f86d081884c7d65
                    status: 400
                    title: Bad Request
                    type: https://pushward.app/errors/bad-request
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              examples:
                key_expired:
                  summary: Integration key past its expires_at
                  value:
                    code: integration_key.expired
                    detail: integration key expired
                    instance: /requests/9f86d081884c7d65
                    status: 401
                    title: Unauthorized
                    type: https://pushward.app/errors/unauthorized
                token_invalid:
                  summary: Missing, unknown or revoked token
                  value:
                    code: token.invalid
                    detail: invalid token
                    instance: /requests/9f86d081884c7d65
                    status: 401
                    title: Unauthorized
                    type: https://pushward.app/errors/unauthorized
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              examples:
                insufficient_scope:
                  summary: Integration key's notifications level is none
                  value:
                    code: integration_key.permission_denied
                    detail: "insufficient permissions: requires notifications:send"
                    instance: /requests/9f86d081884c7d65
                    status: 403
                    title: Forbidden
                    type: https://pushward.app/errors/forbidden
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              examples:
                unprocessable_entity:
                  value:
                    detail: validation failed
                    errors:
                      - location: query.wait
                        message: expected number <= 25
                    instance: /requests/9f86d081884c7d65
                    status: 422
                    title: Unprocessable Entity
