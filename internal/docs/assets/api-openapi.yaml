              maxLength: 2048
              type: string
          required:
            - url
          type: object
        warning_pushed:
          description: Server-set flag indicating a countdown warning push has been sent.
          readOnly: true
          type: boolean
        warning_threshold:
          description: Seconds before end_date when accent color turns orange and a warning push is sent. Once set, persists across updates until explicitly cleared with null.
          minimum: 0
          type: integer
      required:
        - template
      title: Countdown
      type: object
    ContentGauge:
      additionalProperties: true
      description: Single numeric value rendered against a min/max range.
      properties:
        accent_color:
          description: "Accent color: named color or hex (#RRGGBB / #RRGGBBAA)."
          type: string
        background_color:
          description: "Background color: named color or hex."
          type: string
        decimals:
          description: "Decimal places for value display. Omitted: automatic formatting."
          maximum: 10
          minimum: 0
          type: integer
        icon:
          description: "Icon name. SF Symbol (e.g. washer, flame) or Material Design Icon with mdi: prefix (e.g. mdi:thermometer)."
          maxLength: 128
          type: string
        max_value:
          description: Maximum value of the range. Required when template is gauge.
          type: number
        min_value:
          description: Minimum value of the range. Required when template is gauge.
          type: number
        progress:
          description: Progress value [0.0 - 1.0]
          maximum: 1
