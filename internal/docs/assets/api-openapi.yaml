                    instance: /requests/9f86d081884c7d65
                    status: 401
                    title: Unauthorized
                    type: https://pushward.app/errors/unauthorized
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
