                    status: 403
                    title: Forbidden
                    type: https://pushward.app/errors/forbidden
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              examples:
                widget.not_found:
