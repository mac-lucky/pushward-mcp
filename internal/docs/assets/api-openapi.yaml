          description: Per-step row indices (1-10) for multi-row step layouts.
          items:
            type: integer
          type: array
        step_weights:
          description: Relative step widths (one positive number per step). On its own draws a single row of proportional segments; combined with step_rows it sizes each column's width while step_rows drives its fan-out.
