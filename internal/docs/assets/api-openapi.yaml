            - activity:none
            - activity:read
            - activity:update
            - activity:manage
          type: string
        widget_slugs:
          description: Restrict key to specific widget slugs or patterns (trailing *); an empty list or null removes the restriction
          items:
            type: string
          type:
            - array
            - "null"
        widgets:
          description: "Legacy: true sets permissions.widgets to write, false to none"
          type: boolean
      type: object
    UpdateWidgetRequest:
      additionalProperties: false
