            - $ref: "#/components/schemas/ContentCountdown"
              title: Countdown
            - $ref: "#/components/schemas/ContentSteps"
              title: Steps
            - $ref: "#/components/schemas/ContentAlert"
              title: Alert
            - $ref: "#/components/schemas/ContentGauge"
              title: Gauge
            - $ref: "#/components/schemas/ContentTimeline"
              title: Timeline
            - $ref: "#/components/schemas/ContentBoard"
              title: Board
            - $ref: "#/components/schemas/ContentLog"
              title: Log
            - $ref: "#/components/schemas/ContentMedia"
              title: Media
            - $ref: "#/components/schemas/ContentApproval"
              title: Approval
        dismissal_ttl:
          description: "Seconds after ENDED before Lock Screen removal (0 = immediate, max 4h). Tri-state: omit to keep, null to clear, number to set."
          format: int64
          maximum: 14400
          minimum: 0
          type: integer
        ended_ttl:
          description: "Seconds after ENDED before auto-delete. Tri-state: omit to keep, null to clear, number to set."
          format: int64
          maximum: 2592000
          minimum: 1
          type: integer
        priority:
          format: int64
          type: integer
        sound:
          description: Optional Live Activity alert sound. 'default' uses the iOS system sound; other values must match a bundled sound.
          enum:
            - default
            - chime
            - alert
            - success
            - warning
            - bell
            - ding
            - buzz
            - notification
          type: string
        stale_ttl:
          description: "Seconds of inactivity before auto-end. Tri-state: omit to keep, null to clear, number to set."
          format: int64
          maximum: 2592000
          minimum: 1
          type: integer
        state:
          description: Target state. Accepts ongoing or ended (case-insensitive). Optional - if omitted, the current stored state is kept. Setting ended on an ongoing activity ends the Live Activity; the card then stays on the Lock Screen for dismissal_ttl seconds (or ended_ttl capped at 4h when dismissal_ttl is unset).
          type: string
        target:
          $ref: "#/components/schemas/OrgTargetRequest"
          description: "Organization keys only: who the Live Activity reaches, narrowing the organization's routing rules. Tri-state: omit to keep, null to clear (everyone the rules allow), object to replace. Devices that lose it end it; devices that gain it start it."
      type: object
    UpdateIntegrationKeyInputBody:
