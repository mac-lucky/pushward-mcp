    ContentSteps:
      additionalProperties: true
      description: Multi-step workflow showing the current step out of a total (e.g. CI pipeline jobs).
      properties:
        accent_color:
          description: "Accent color: named color or hex (#RRGGBB / #RRGGBBAA)."
          type: string
        background_color:
          description: "Background color: named color or hex."
          type: string
        compact_label:
          description: Up to 4 characters shown in the Dynamic Island compact leading ear in place of that template's default (the icon, the steps ring, or the timeline high/low stack). Applies to every template. Leading and trailing whitespace is removed server-side and the 4-character limit applies to the trimmed value, so send it trimmed. The minimal presentation ignores it.
          maxLength: 4
          type: string
        current_step:
          description: The step currently running, counting from 1 (0 = not started). Shown as current_step/total_steps. Required when template is steps.
          minimum: 0
          type: integer
        duration:
          description: "How long the current step takes. Integer seconds (60) or a duration string (\"60s\", \"5m\", \"1h30m\"). Sets start_date = now and end_date = now + duration, so sending it alongside current_step re-anchors the live_progress animation to the new step. Send it only when current_step changes: restamping the window on every update makes each one a high-priority push that skips update coalescing, and snaps the bar back to empty. If both duration and end_date are provided, end_date wins."
          oneOf:
            - maximum: 157788000
              minimum: 1
              type: integer
            - pattern: ^(\d+|(\d+[hms])+)$
              type: string
        end_date:
          description: Unix timestamp when the current step is expected to finish (the ETA anchor for live_progress) - not the end of the whole run.
          type: integer
        icon:
          description: "Icon name. SF Symbol (e.g. washer, flame) or Material Design Icon with mdi: prefix (e.g. mdi:thermometer)."
          maxLength: 128
          type: string
        image_shape:
          description: "How the image is framed: poster (2:3 cover art), square, or circle. Defaults to square when omitted."
          enum:
            - poster
            - square
            - circle
          type: string
        image_thumbhash:
          description: ThumbHash of the image as padded standard-alphabet base64 (about 28 characters). Renders as a blurred stand-in until the download lands, and is the only tier that shows anything for an image the device cannot reach.
          maxLength: 64
          type: string
        image_url:
          description: "https URL of an image shown beside the icon. The server never fetches it: the device downloads and caches it, so the host must be publicly reachable over https (a LAN or Tailscale address will not load). Send image_thumbhash alongside it as the fallback. On updates an omitted key keeps the stored URL; null clears it (\"\" also clears)."
          maxLength: 2048
          type: string
        live_progress:
          description: "Opt-in client-side interpolation: iOS animates the current step's bar from start_date to end_date between pushes instead of rendering a static fill. Requires end_date. Re-send it (or duration) on each step change to re-anchor. Cleared with null."
          type: boolean
        progress:
          description: Progress value [0.0 - 1.0]
          maximum: 1
          minimum: 0
          type: number
        remaining_time:
          description: Remaining time in seconds.
          minimum: 0
          type: integer
        secondary_url:
          description: Secondary button URL (legacy). Use secondary_url_action for richer routing.
          maxLength: 2048
          type: string
        secondary_url_action:
          description: Secondary button. See url_action for semantics.
          properties:
            body:
              description: HTTP request body for silent webhook. <=1KB. Ignored for custom-scheme URLs.
              maxLength: 1024
              type: string
            foreground:
              description: "For http(s) URLs only: true opens the URL in Safari / in-app browser; false fires the request silently without launching the app (silent webhook). Ignored for custom-scheme URLs."
              type: boolean
            headers:
              additionalProperties:
                type: string
              description: HTTP headers for silent webhook. Total <=1KB. Ignored for custom-scheme URLs.
              type: object
            icon:
              description: SF Symbol name (e.g. checkmark.circle).
              maxLength: 64
              type: string
            method:
