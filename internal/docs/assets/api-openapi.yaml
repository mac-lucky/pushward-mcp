        step_labels:
          description: Per-step labels. The rendered slot is 1/total_steps of the bar width, so the cap is reachable only at low step counts - four steps show about 14 characters on the Lock Screen, sixty-four show about three.
          items:
            maxLength: 32
            type: string
          type: array
