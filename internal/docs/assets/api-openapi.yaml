          description: Unix timestamp when the current step began; must be before end_date. Sent automatically by duration; the animation runs across start_date..end_date. Omit it and iOS falls back to deriving the fill from progress.
          type: integer
        state:
          description: Short status text (e.g. Washing, Build Container Image).
