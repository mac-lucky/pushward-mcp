    patch:
      description: "Partial update using RFC 7396 JSON Merge Patch semantics. Fields present in the request body overwrite stored values; fields set to null clear them; absent fields are preserved. Top-level `state` is optional - if omitted, the current stored state is kept (unless the activity is PREEMPTED, in which case the caller must set ONGOING or ENDED explicitly). Top-level `ended_ttl`, `stale_ttl`, and `dismissal_ttl` are patchable with the same tri-state semantics (omit = keep, null = clear, number = set); `dismissal_ttl: 0` sent together with `state: ended` removes the card from the Lock Screen immediately. Changing `ended_ttl` on an already-ENDED activity does not reschedule its pending auto-delete - it applies on the next end. Once set, alarm and warning_threshold persist across updates until explicitly cleared with null. If both end_date and duration are provided, end_date wins. When state transitions to ENDED the server clears alarm, snoozed_until, and warning_pushed unconditionally. With `?upsert=true` a missing slug is created first and the response is `201` with `X-Resource-Action: created` (`409` if the activity cap is reached)."
      operationId: updateActivity
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
        - description: When true and no activity with this slug exists, create it first (name defaults to the slug) and then apply the patch. Requires activity:manage scope or full access; activity:update keys get 403 activity.upsert_forbidden. Without this flag a missing slug is always 404.
          explode: false
          in: query
          name: upsert
          schema:
            description: When true and no activity with this slug exists, create it first (name defaults to the slug) and then apply the patch. Requires activity:manage scope or full access; activity:update keys get 403 activity.upsert_forbidden. Without this flag a missing slug is always 404.
            type: boolean
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/UpdateActivityRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
          description: OK
          headers:
            X-Resource-Action:
              schema:
                description: "'created' when ?upsert=true inserted a new activity; 'updated' otherwise."
                type: string
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
          description: Created (the slug did not exist and ?upsert=true created it)
