        subject:
          description: Email subject line.
          maxLength: 256
          minLength: 1
          type: string
        text_body:
          description: Plain-text body. Provide html_body, text_body, or both.
          maxLength: 65536
          type: string
        to:
          description: Recipient address. Must be a verified, non-unsubscribed recipient of the calling account.
          format: email
          maxLength: 254
          minLength: 3
          type: string
      required:
        - to
        - subject
      type: object
    StatRow:
      additionalProperties: false
      properties:
