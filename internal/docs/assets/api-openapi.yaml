          $ref: "#/components/schemas/TimerValue"
        unit:
          examples:
            - USD
          maxLength: 16
          type: string
        value:
          examples:
            - $8 333
          maxLength: 32
          type: string
      required:
        - label
        - value
      type: object
    TapAction:
      additionalProperties: false
      properties:
        body:
          maxLength: 1024
          type: string
        foreground:
          type: boolean
        headers:
          additionalProperties:
            type: string
          description: HTTP headers for a webhook action. Keys and values together must not exceed 1024 bytes.
          type: object
        icon:
          maxLength: 64
          type: string
        method:
          type: string
        title:
          maxLength: 64
          type: string
